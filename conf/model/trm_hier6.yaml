_target_: models.trm_control.TRMHier6Trunk
hidden_size: 128
expansion: 4
L_layers: 2
H_cycles: 3      # outer recursion depth (T) — only the last cycle is backpropped
L_cycles: 6      # inner latent-refinement steps per outer cycle (n), round-robin over n_latents slots
n_latents: 6     # number of parallel low-level latent slots
rms_norm_eps: 1e-5
output_init: uniform_small # fanin | orthogonal | uniform_small — used by the actor/critic output head

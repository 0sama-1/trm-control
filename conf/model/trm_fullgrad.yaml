_target_: models.trm_control.TRMTrunk
name: trm_fullgrad
# Phase 4 Stage A (papers/phase4/plan.md): conf/model/trm.yaml with TRM's
# training discipline restored. full_grad backprops through all
# H_cycles x (L_cycles + 1) = 21 cell applications (trm.yaml: last cycle only, 7).
# deep_sup regresses every outer cycle's critic readout on the TD target.
hidden_size: 128
expansion: 4
L_layers: 2
H_cycles: 3
L_cycles: 6
rms_norm_eps: 1e-5
output_init: uniform_small
full_grad: true
deep_sup: false

_target_: models.trm_control.TRMCarryTrunk
name: trm_carryz
# Phase 3 Stage 2 (plan §4.3 / §7 E-2): the recursive trunk with its latent
# carried across environment steps ("Carry Z"), trained from stored carries
# in replay. Same parameters as conf/model/trm.yaml; only the recursion's
# starting point differs.
hidden_size: 128
expansion: 4
L_layers: 2
H_cycles: 3      # outer recursion depth (T) — only the last cycle is backpropped
L_cycles: 6      # inner latent-refinement steps per outer cycle (n)
rms_norm_eps: 1e-5
output_init: uniform_small # fanin | orthogonal | uniform_small — used by the actor/critic output head

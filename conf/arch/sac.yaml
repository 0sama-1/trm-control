name: sac
model_name: sac_pendulum.pt

total_episodes: 200

gamma: 0.99
tau: 0.005

actor_lr: 3e-4
critic_lr: 3e-4

buffer_size: 200000
batch_size: 256
warmup_steps: 10000
updates_per_step: 1

hidden_dim: 256

# entropy temperature — auto-tuned by default; set auto_alpha: false to use fixed alpha
auto_alpha: true
alpha_lr: 3e-4
alpha: 0.2

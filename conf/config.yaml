defaults:
  - arch: ddpg
  - model: dnn
  - env: pendulum
  - delay: stochastic
  - _self_

seed: 42
print_stat_every: 10
record_every: 25
eval_every: 10        # run one deterministic (noise-free) eval episode every N training episodes, logged as eval_return — see augmentation.md
augment_obs: false    # append the pending (committed, not-yet-applied) action queue to the observation — see augmentation.md. No-op when delay.name=none.
video_folder: videos
model_folder: models
results_folder: results   # per-run final reward/wall-clock/param-count JSON — see trainer.py::_write_results_summary
prev_action_obs: false     # append the previous committed action to the observation (Phase 3 Stage 2 input design, plan §10 A-6)
run_tag: ""                # optional suffix on the results filename, for arms that share every other identity field (Phase 3)
track_step_history: true  # per-env-step record (action, applied_action, delay, reward) in results_summary.json — see trainer.py::OffPolicyTrainer._training_loop

wandb:
  enabled: true
  project: trm-delay-robust-scaling
  entity: null
  log_steps: true   # mirror the per-step history into W&B too (see logger.py::WandbLogger.log_step); opt-in since it's a lot of API calls over a full run
